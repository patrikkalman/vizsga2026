<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autós / Motoros Oldal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    .topbar {
      background: #111827;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #f59e0b;
    }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .content {
      padding: 40px 30px;
    }
    .hero {
      background: linear-gradient(135deg, #1f2937, #111827);
      border: 1px solid #374151;
      border-radius: 18px;
      padding: 30px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 38px;
      color: #f8fafc;
    }
    p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 18px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 20px;
    }
    .card h3 {
      margin-top: 0;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Motor & Auto</div>
    <button class="logout-btn" id="logoutBtn">Kijelentkezés</button>
  </div>

  <div class="content">
    <div class="hero">
      <h1>Üdvözöllek, <span id="userName">Vendég</span>!</h1>
      <p>
        Ez itt a főoldal, ide kerülhet a motorsport, autó, kereskedés, hirdetési rész,
        galéria vagy bármilyen egyéb tartalom, amit később szeretnél megjeleníteni.
      </p>

      <div class="cards">
        <div class="card">
          <h3>Új autók</h3>
          <p>Sportautók, SUV-ok és városi modellek.</p>
        </div>
        <div class="card">
          <h3>Motorok</h3>
          <p>Sport, touring és klasszikus motorok.</p>
        </div> 
      </div>
    </div>
  </div>

  <script>
    const user = localStorage.getItem("loggedInUser");

    if (!user) {
      window.location.href = "bejelentkezesioldal.html";
    }

    document.getElementById("userName").textContent = user;

    document.getElementById("logoutBtn").addEventListener("click", function () {
      localStorage.removeItem("loggedInUser");
      window.location.href = "bejelentkezesioldal.html";
    });
  </script>
</body>
</html>
