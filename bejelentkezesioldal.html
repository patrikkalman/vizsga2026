<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            display: grid;
            place-items: center;
            height: 100vh
        }
        .box {
            width: 360px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25)
        }
        .tab {
            display: flex;
            gap: 8px;
            margin: 16px 0
        }
        .tab button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #cbd5e1;
            cursor: pointer
        }
        .tab .active {
            background: #f97316;
            border-color: #f97316;
            color: #fff
        }

        input,button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            margin-top: 10px;
            font-size: 16px
        }
        input {
            background: #0f172a;
            color: #fff
        }
        button {
            background: #f97316;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 700
        }
        .hidden {
            display: none
        }
        .msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px
        }
        .error {
            background: rgba(239, 68, 68, .15);
            border: 1px solid rgba(239, 68, 68, .3);
            color: #fecaca
        }
        .success {
            background: rgba(34, 197, 94, .12);
            border: 1px solid rgba(34, 197, 94, .3);
            color: #bbf7d0
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="tab">
            <button class="active" type="button" data-tab="login">Bejelentkezés</button>
            <button type="button" data-tab="reg">Regisztráció</button>
        </div>

        <form id="loginForm">
            <input id="loginUser" type="text" placeholder="Felhasználónév" required>
            <input id="loginPass" type="password" placeholder="Jelszó" required>
            <button type="submit">Belépés</button>
        </form>

        <form id="regForm" class="hidden">
            <input id="regUser" type="text" placeholder="Új felhasználónév" required>
            <input id="regPass" type="password" placeholder="Jelszó" required>
            <button type="submit">Regisztráció</button>
        </form>

        <div id="msg" class="msg hidden"></div>
    </div>

    <script>
        const KEY = 'registered_users_db';
        const userKey = 'loggedInUser';
        const db = JSON.parse(localStorage.getItem(KEY) || '{"admin":"123"}');
        localStorage.setItem(KEY, JSON.stringify(db));

        if (localStorage.getItem(userKey)) window.location.href = 'fooldal.html';

        function showMsg(text, type = 'error') {
            const m = document.getElementById('msg');
            m.textContent = text;
            m.className = 'msg ' + type;
            m.classList.remove('hidden');
        }

        document.querySelectorAll('.tab button').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab button').forEach(b => b.classList.toggle('active', b === btn));
                document.getElementById('loginForm').classList.toggle('hidden', btn.dataset.tab !== 'login');
                document.getElementById('regForm').classList.toggle('hidden', btn.dataset.tab !== 'reg');
                document.getElementById('msg').classList.add('hidden');
            };
        });

        document.getElementById('loginForm').onsubmit = e => {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            const users = JSON.parse(localStorage.getItem(KEY) || '{}');
            if (users[u] && users[u] === p) {
                localStorage.setItem(userKey, u);
                window.location.href = 'fooldal.html';
            } else {
                showMsg('Hibás felhasználónév vagy jelszó!');
            }
        };

        document.getElementById('regForm').onsubmit = e => {
            e.preventDefault();
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const users = JSON.parse(localStorage.getItem(KEY) || '{}');
            if (!u || !p) return showMsg('Töltsd ki az összes mezőt!');
            if (users[u]) return showMsg('Ez a felhasználónév már foglalt!');
            users[u] = p;
            localStorage.setItem(KEY, JSON.stringify(users));
            document.getElementById('regForm').reset();
            document.querySelector('[data-tab="login"]').click();
            document.getElementById('loginUser').value = u;
            showMsg('Sikeres regisztráció!', 'success');
        };
    </script>
</body>

</html>
